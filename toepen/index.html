<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071b13"><meta name="apple-mobile-web-app-capable" content="yes"><title>Toepen</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#06150f;color:#fff}body{min-height:100dvh;background:radial-gradient(circle at 50% -10%,#245c43 0,#102e21 35%,#06150f 75%);overflow-x:hidden}.app{max-width:480px;min-height:100dvh;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;padding:4px 3px 13px}.brand{font-family:Georgia,serif;font-size:30px;font-weight:800;letter-spacing:-1px}.brand span{color:#e5b65c}.round{font-size:12px;font-weight:800;letter-spacing:.08em;background:#ffffff12;border:1px solid #ffffff1a;border-radius:999px;padding:9px 12px;color:#d8e7df}.players{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.player{position:relative;background:linear-gradient(155deg,#fff,#e9eee9);color:#11261c;border-radius:15px;padding:10px 3px 8px;text-align:center;box-shadow:0 8px 20px #0005;border:1px solid #fff;min-width:0}.player .name{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player .pts{font-family:Georgia,serif;font-size:31px;line-height:35px;font-weight:900}.player .tag{height:13px;font-size:8px;font-weight:900;letter-spacing:.06em;color:#748078}.player.pelt{background:linear-gradient(155deg,#fff8e4,#f4d58e);box-shadow:0 0 0 2px #e5b65c,0 8px 22px #0005}.player.pelt .tag{color:#9b6810}.player.dead{opacity:.3;filter:grayscale(1)}.felt{flex:1;display:flex;flex-direction:column;justify-content:center;padding:17px 0 12px}.status{text-align:center;margin-bottom:13px}.status .eyebrow{font-size:10px;color:#9eb8aa;font-weight:800;letter-spacing:.14em}.status .value{font-family:Georgia,serif;font-size:24px;margin-top:3px}.status .value b{color:#e5b65c}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{font:inherit;cursor:pointer;border:0}.action{min-height:64px;border-radius:18px;font-weight:900;font-size:17px;box-shadow:inset 0 1px #ffffff40,0 8px 18px #0003}.toep{background:linear-gradient(#efc46e,#d99d35);color:#251807}.over{background:linear-gradient(#f7f4ea,#dce5de);color:#11251b}.blind{grid-column:1/-1;min-height:48px;background:#ffffff0d;border:1px solid #ffffff1b;color:#d9e7df;border-radius:16px;font-weight:800}.blind.on{background:#7255ba;color:#fff}.divider{display:flex;align-items:center;gap:9px;color:#819d8e;font-size:10px;font-weight:900;letter-spacing:.12em;margin:18px 0 9px}.divider:before,.divider:after{content:"";height:1px;background:#ffffff15;flex:1}.winners{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.winner{min-height:54px;border-radius:15px;background:#173e2c;border:1px solid #ffffff17;color:#fff;font-size:11px;font-weight:900;box-shadow:0 6px 14px #0002}.winner:active,.action:active{transform:scale(.97)}.notice{text-align:center;min-height:32px;padding-top:10px;font-size:12px;color:#a9c0b4}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px}.utility{min-height:45px;border-radius:14px;background:#ffffff09;border:1px solid #ffffff14;color:#a9c0b4;font-size:12px;font-weight:800}@media(max-width:370px){.app{padding-left:9px;padding-right:9px}.players,.winners{gap:4px}.player .pts{font-size:27px}.player .name,.winner{font-size:10px}}
</style></head><body><main class="app"><header class="top"><div class="brand">♠ <span>TOEPEN</span></div><div class="round" id="round">RONDE 1</div></header><section class="players" id="players"></section><section class="felt"><div class="status"><div class="eyebrow">HUIDIGE INZET</div><div class="value" id="stake">Normaal · <b>1 punt</b></div></div><div class="actions"><button class="action toep" id="toep">TOEP! · 2</button><button class="action over" id="over">OVERTOEP · 3</button><button class="blind" id="blind">🙈 Blind spelen</button></div><div class="divider">WIE WINT DE RONDE?</div><div class="winners" id="winners"></div><div class="notice" id="notice">Tik op de winnaar om af te rekenen</div></section><footer class="bottom"><button class="utility" id="undo">↶ Ongedaan</button><button class="utility" id="new">Nieuw potje</button></footer></main><script>
const names=['Wietse','Niek','Ise','Tjerk','Gert'];let p=names.map(name=>({name,pts:0})),round=1,stake=1,blind=false,hist=[];const el=id=>document.getElementById(id),isPelt=x=>x.pts===14;
function render(){el('round').textContent='RONDE '+round;el('stake').innerHTML=(blind?'🙈 Blind · ':'')+(stake===1?'Normaal · ':'Inzet · ')+'<b>'+stake+' punt'+(stake>1?'en':'')+'</b>';el('blind').classList.toggle('on',blind);el('blind').textContent=blind?'🙈 Blind staat AAN':'🙈 Blind spelen';el('players').innerHTML=p.map(x=>'<div class="player '+(isPelt(x)?'pelt ':'')+(x.pts>=15?'dead':'')+'"><div class="name">'+x.name+'</div><div class="pts">'+x.pts+'</div><div class="tag">'+(isPelt(x)?'⚠ PELT':x.pts>=15?'UIT':'PUNTEN')+'</div></div>').join('');el('winners').innerHTML=p.map((x,i)=>x.pts<15?'<button class="winner" onclick="win('+i+')">'+x.name+'</button>':'').join('')}
function setStake(n){if(p.some(isPelt)){el('notice').textContent='⚠ PELT — er mag niet getoept worden';navigator.vibrate?.(80);return}stake=n;el('notice').textContent=n===2?'🔥 TOEP!':'🔥 OVERTOEP!';navigator.vibrate?.(35);render()}
function win(i){hist.push(JSON.stringify({p,round,stake,blind}));p=p.map((x,j)=>({...x,pts:j===i?x.pts:Math.min(15,x.pts+stake)}));round++;stake=1;blind=false;render();const alive=p.filter(x=>x.pts<15);el('notice').textContent=alive.length===1?'🏆 '+alive[0].name+' wint het potje!':'✓ Ronde verwerkt'}
el('toep').onclick=()=>setStake(2);el('over').onclick=()=>setStake(3);el('blind').onclick=()=>{blind=!blind;navigator.vibrate?.(25);render()};el('undo').onclick=()=>{if(!hist.length)return;const s=JSON.parse(hist.pop());p=s.p;round=s.round;stake=s.stake;blind=s.blind;render();el('notice').textContent='Vorige ronde hersteld'};el('new').onclick=()=>{if(confirm('Nieuw potje starten?')){p=names.map(name=>({name,pts:0}));round=1;stake=1;blind=false;hist=[];render()}};render();
</script></body></html>
