<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10261d"><title>Toepen</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f7f2e8;background:#07150f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1d4936,#07150f 55%);padding:18px}.app{max-width:760px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}.hero h1{margin:0;font-size:34px}.sub{color:#b8c9bf;font-size:13px}.round{background:#ffffff10;border:1px solid #ffffff20;padding:10px 14px;border-radius:16px}.players{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.card{background:#fff;color:#102018;border-radius:18px;padding:13px 8px;text-align:center;box-shadow:0 10px 25px #0004}.name{font-weight:800}.pts{font-size:34px;font-weight:900}.small{font-size:11px;color:#64736b}.pelt{outline:3px solid #f0b44d}.panel{margin-top:14px;background:#ffffff0d;border:1px solid #ffffff1c;border-radius:22px;padding:16px}.stake{text-align:center;font-size:18px;margin-bottom:12px}.actions,.winners{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}button{border:0;border-radius:15px;min-height:54px;font-weight:800;font-size:15px;padding:10px;background:#e9efe9;color:#112319}.primary{background:#f0b44d}.blind.on{background:#9c6cff;color:white}.winner{background:#214f3a;color:white;border:1px solid #ffffff20}.winners{grid-template-columns:repeat(5,1fr);margin-top:9px}.notice{min-height:22px;margin:12px 2px 0;color:#c7d5cd;font-size:13px}.footer{display:flex;gap:8px;margin-top:12px}.footer button{flex:1;background:#ffffff12;color:#eaf2ed;border:1px solid #ffffff1d}.dead{opacity:.38}@media(max-width:620px){.players{grid-template-columns:repeat(3,1fr)}.winners{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr 1fr}.hero h1{font-size:29px}}
</style></head><body><main class="app"><div class="hero"><div><div class="sub">WIETSE · NIEK · ISE · TJERK · GERT</div><h1>♠ Toepen</h1></div><div class="round" id="round">Ronde 1</div></div><section class="players" id="players"></section><section class="panel"><div class="stake" id="stake">Normaal · <b>1 punt</b></div><div class="actions"><button id="toep" class="primary">TOEP! · 2</button><button id="over">OVERTOEP · 3</button><button id="blind" class="blind">🙈 BLIND</button></div><div style="margin-top:16px;font-weight:800">Wie wint de ronde?</div><div class="winners" id="winners"></div><div class="notice" id="notice">Tik op de winnaar om de ronde af te rekenen.</div></section><div class="footer"><button id="undo">↶ Ongedaan</button><button id="new">Nieuw potje</button></div></main>
<script>
const names=['Wietse','Niek','Ise','Tjerk','Gert'];let p=names.map(name=>({name,pts:0})),round=1,stake=1,blind=false,hist=[];
const el=id=>document.getElementById(id);
function pelt(x){return x.pts===14} function render(){el('round').textContent='Ronde '+round;el('stake').innerHTML=(blind?'🙈 Blind · ':'')+(stake===1?'Normaal · ':'Inzet · ')+'<b>'+stake+' punt'+(stake>1?'en':'')+'</b>';el('blind').classList.toggle('on',blind);el('players').innerHTML=p.map(x=>'<div class="card '+(pelt(x)?'pelt ':'')+(x.pts>=15?'dead':'')+'"><div class="name">'+x.name+'</div><div class="pts">'+x.pts+'</div><div class="small">'+(pelt(x)?'⚠ PELT':x.pts>=15?'UIT':'strafpunten')+'</div></div>').join('');el('winners').innerHTML=p.map((x,i)=>x.pts<15?'<button class="winner" onclick="win('+i+')">'+x.name+'</button>':'').join('')}
function setStake(n){if(p.some(pelt)){el('notice').textContent='⚠ Iemand staat op PELT: toepen is geblokkeerd.';return}stake=n;el('notice').textContent=n===2?'TOEP!':'OVERTOEP!';render()}
function win(i){hist.push(JSON.stringify({p,round,stake,blind}));p=p.map((x,j)=>({...x,pts:j===i?x.pts:Math.min(15,x.pts+stake)}));el('notice').textContent='✓ '+p[i].name+' wint ronde '+round;round++;stake=1;blind=false;render();const alive=p.filter(x=>x.pts<15);if(alive.length===1)el('notice').textContent='🏆 '+alive[0].name+' wint het potje!'}
el('toep').onclick=()=>setStake(2);el('over').onclick=()=>setStake(3);el('blind').onclick=()=>{blind=!blind;render()};el('undo').onclick=()=>{if(!hist.length)return;const s=JSON.parse(hist.pop());p=s.p;round=s.round;stake=s.stake;blind=s.blind;render()};el('new').onclick=()=>{if(confirm('Nieuw potje starten?')){p=names.map(name=>({name,pts:0}));round=1;stake=1;blind=false;hist=[];render()}};render();
</script></body></html>
