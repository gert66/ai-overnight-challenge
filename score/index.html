<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071b13"><title>Stand</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#245c43,#071b13 55%,#04100c);color:#fff;font-family:Inter,system-ui,sans-serif}.app{max-width:480px;margin:auto;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}h1{font:800 32px Georgia,serif;margin:4px 0 5px;color:#e8ba61}.sub{color:#a9c1b5;font-size:13px;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:linear-gradient(155deg,#fff,#e8eee9);color:#10251b;border-radius:24px;padding:17px 12px 13px;text-align:center;box-shadow:0 12px 30px #0005}.name{font-weight:900;font-size:18px}.score{font:900 64px/1 Georgia,serif;margin:10px 0 14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls button{border:0;border-radius:15px;min-height:54px;font-size:28px;font-weight:900}.minus{background:#dfe5e0;color:#20372c}.plus{background:#e4b258;color:#241806}.controls button:active{transform:scale(.95)}.spacer{flex:1}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}.bottom button{min-height:50px;border-radius:16px;border:1px solid #ffffff18;background:#ffffff0a;color:#c8d8d0;font-weight:800;font-size:13px}@media(max-width:360px){.app{padding-left:10px;padding-right:10px}.grid{gap:8px}.score{font-size:54px}}</style></head><body><main class="app"><h1>♠ Stand</h1><div class="sub">Tik + of − om de score bij te houden.</div><section class="grid" id="grid"></section><div class="spacer"></div><div class="bottom"><button id="undo">↶ Ongedaan</button><button id="reset">Nieuwe stand</button></div></main><script>
const names=['Wietse','Gert','Nic','Tjerk'];let scores=JSON.parse(localStorage.getItem('simpleScores')||'null')||[0,0,0,0],history=[];
const grid=document.getElementById('grid');function render(){grid.innerHTML=names.map((n,i)=>'<div class="card"><div class="name">'+n+'</div><div class="score">'+scores[i]+'</div><div class="controls"><button class="minus" onclick="change('+i+',-1)">−</button><button class="plus" onclick="change('+i+',1)">+</button></div></div>').join('');localStorage.setItem('simpleScores',JSON.stringify(scores))}
function change(i,d){history.push([...scores]);scores[i]+=d;navigator.vibrate?.(18);render()}document.getElementById('undo').onclick=()=>{if(history.length){scores=history.pop();render()}};document.getElementById('reset').onclick=()=>{if(confirm('Alle scores weer op 0?')){history.push([...scores]);scores=[0,0,0,0];render()}};render();
</script></body></html>
