<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#061c35"/><stop offset="1" stop-color="#073050"/></linearGradient><style>.t{font-family:Arial,sans-serif;fill:#f7fbff}.m{font-family:Arial,sans-serif;fill:#c5d9eb}.h{font-weight:700}.s{font-size:15px}</style></defs><rect width="1500" height="760" rx="28" fill="url(#b)" stroke="#1676ad"/><text x="50" y="65" class="t h" font-size="42">The simple architecture</text><text x="50" y="100" class="m" font-size="21">From a global assignment to controlled autonomous software development</text><g transform="translate(30 145)"><rect x="0" width="180" height="350" rx="20" fill="#0b3153" stroke="#ffad45" stroke-width="2"/><circle cx="90" cy="45" r="22" fill="#ffad45" opacity=".25"/><text x="90" y="52" text-anchor="middle" class="t h" font-size="20">1</text><text x="90" y="95" text-anchor="middle" class="t h" font-size="19">Human</text><text x="90" y="125" text-anchor="middle" class="m" font-size="14">Global assignment</text><text x="20" y="205" class="m s">• Goal &amp; context</text><text x="20" y="233" class="m s">• Constraints</text><text x="20" y="261" class="m s">• Success criteria</text><path d="M180 175h25" stroke="#58c7ff" stroke-width="4"/><path d="M197 167l12 8-12 8" fill="#58c7ff"/><rect x="205" width="180" height="350" rx="20" fill="#0b3153" stroke="#43a8ff" stroke-width="2"/><circle cx="295" cy="45" r="22" fill="#43a8ff" opacity=".25"/><text x="295" y="52" text-anchor="middle" class="t h" font-size="20">2</text><text x="295" y="95" text-anchor="middle" class="t h" font-size="19">AI</text><text x="295" y="125" text-anchor="middle" class="m" font-size="14">ChatGPT intake</text><text x="225" y="205" class="m s">• Ask questions</text><text x="225" y="233" class="m s">• Refine context</text><text x="225" y="261" class="m s">• Create plan</text><path d="M385 175h25" stroke="#58c7ff" stroke-width="4"/><path d="M402 167l12 8-12 8" fill="#58c7ff"/><rect x="410" width="180" height="350" rx="20" fill="#0b3153" stroke="#32e0cf" stroke-width="2"/><circle cx="500" cy="45" r="22" fill="#32e0cf" opacity=".25"/><text x="500" y="52" text-anchor="middle" class="t h" font-size="20">3</text><text x="500" y="95" text-anchor="middle" class="t h" font-size="19">Orchestrator</text><text x="500" y="125" text-anchor="middle" class="m" font-size="14">Deterministic control</text><text x="430" y="205" class="m s">• Workflow &amp; state</text><text x="430" y="233" class="m s">• Locks &amp; transitions</text><text x="430" y="261" class="m s">• Git safety</text><text x="430" y="289" class="m s">• Tests &amp; commits</text><path d="M590 175h25" stroke="#58c7ff" stroke-width="4"/><path d="M607 167l12 8-12 8" fill="#58c7ff"/><rect x="615" width="180" height="350" rx="20" fill="#0b3153" stroke="#a887ff" stroke-width="2"/><circle cx="705" cy="45" r="22" fill="#a887ff" opacity=".25"/><text x="705" y="52" text-anchor="middle" class="t h" font-size="20">4</text><text x="705" y="95" text-anchor="middle" class="t h" font-size="19">Brain</text><text x="705" y="125" text-anchor="middle" class="m" font-size="14">Next batch</text><text x="635" y="205" class="m s">• Choose next step</text><text x="635" y="233" class="m s">• Select tools</text><text x="635" y="261" class="m s">• Stay in scope</text><path d="M795 175h25" stroke="#58c7ff" stroke-width="4"/><path d="M812 167l12 8-12 8" fill="#58c7ff"/><rect x="820" width="180" height="350" rx="20" fill="#0b3153" stroke="#43a8ff" stroke-width="2"/><circle cx="910" cy="45" r="22" fill="#43a8ff" opacity=".25"/><text x="910" y="52" text-anchor="middle" class="t h" font-size="20">5</text><text x="910" y="95" text-anchor="middle" class="t h" font-size="19">Worker</text><text x="910" y="125" text-anchor="middle" class="m" font-size="14">Execute batch</text><text x="840" y="205" class="m s">• Write code</text><text x="840" y="233" class="m s">• Run tasks</text><text x="840" y="261" class="m s">• Create tests</text><text x="840" y="289" class="m s">• Keep log</text><path d="M1000 175h25" stroke="#58c7ff" stroke-width="4"/><path d="M1017 167l12 8-12 8" fill="#58c7ff"/><rect x="1025" width="180" height="350" rx="20" fill="#0b3153" stroke="#32e0cf" stroke-width="2"/><circle cx="1115" cy="45" r="22" fill="#32e0cf" opacity=".25"/><text x="1115" y="52" text-anchor="middle" class="t h" font-size="20">6</text><text x="1115" y="95" text-anchor="middle" class="t h" font-size="19">Evidence / Tests</text><text x="1115" y="125" text-anchor="middle" class="m" font-size="14">Objective evidence</text><text x="1045" y="205" class="m s">• Diff, files, tests</text><text x="1045" y="233" class="m s">• Scope checks</text><text x="1045" y="261" class="m s">• Collect results</text><text x="1045" y="289" class="m s">• Create report</text><path d="M1205 175h25" stroke="#58c7ff" stroke-width="4"/><path d="M1222 167l12 8-12 8" fill="#58c7ff"/><rect x="1230" width="180" height="350" rx="20" fill="#0b3153" stroke="#b58cff" stroke-width="2"/><circle cx="1320" cy="45" r="22" fill="#b58cff" opacity=".25"/><text x="1320" y="52" text-anchor="middle" class="t h" font-size="20">7</text><text x="1320" y="95" text-anchor="middle" class="t h" font-size="19">Reviewer</text><text x="1320" y="125" text-anchor="middle" class="m" font-size="14">Independent review</text><text x="1250" y="205" class="m s">• Check result</text><text x="1250" y="233" class="m s">• Diff + tests + criteria</text><text x="1250" y="261" class="m s">• PASS / FAIL</text><text x="1250" y="289" class="m s">• Feedback</text></g><path d="M1370 495v85H1010" fill="none" stroke="#42e3a3" stroke-width="4"/><rect x="785" y="545" width="225" height="65" rx="15" fill="#0b4a43" stroke="#42e3a3" stroke-width="2"/><text x="897" y="574" text-anchor="middle" class="t h" font-size="20">Commit</text><text x="897" y="597" text-anchor="middle" class="m s">only after PASS</text><path d="M1370 495v145H650v-145" fill="none" stroke="#ff8a3d" stroke-width="4"/><text x="900" y="632" class="t h" font-size="17">FAIL → repair via Brain</text><rect x="1110" y="625" width="210" height="55" rx="13" fill="#442337" stroke="#ff5b70" stroke-width="2"/><text x="1215" y="650" text-anchor="middle" class="t h" font-size="17">NEEDS_HUMAN</text><text x="1215" y="670" text-anchor="middle" class="m" font-size="13">human decision</text><rect x="40" y="690" width="1420" height="50" rx="15" fill="#0a355a" stroke="#299bdf" stroke-dasharray="7 7"/><text x="70" y="721" class="t h" font-size="18">Desktop Commander · optional VM bridge</text><text x="1430" y="721" text-anchor="end" class="m" font-size="15">The orchestrator remains authoritative · models are interchangeable executors</text></svg>