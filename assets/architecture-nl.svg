<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="De eenvoudige architectuur"><rect width="1440" height="1080" fill="#fff"/><text x="720" y="65" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="850" fill="#08285a"><tspan x="720" dy="0">De eenvoudige architectuur</tspan></text><text x="720" y="110" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="400" fill="#526b8a"><tspan x="720" dy="0">Van globale opdracht naar gecontroleerde autonome softwareontwikkeling</tspan></text><rect x="20" y="155" width="145" height="355" rx="18" fill="#fff3e9" stroke="#f57c16" stroke-width="2"/><text x="92.5" y="215" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#f57c16"><tspan x="92.5" dy="0">●</tspan></text><text x="92.5" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#08285a"><tspan x="92.5" dy="0">Mens</tspan></text><text x="92.5" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#526b8a"><tspan x="92.5" dy="0">globale opdracht</tspan></text><line x1="168" y1="335" x2="184" y2="335" stroke="#1683e8" stroke-width="3"/><polygon points="184,335 174,329 174,341" fill="#1683e8"/><rect x="190" y="155" width="165" height="355" rx="18" fill="#eaf5ff" stroke="#1683e8" stroke-width="2"/><text x="272.5" y="215" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#1683e8"><tspan x="272.5" dy="0">AI</tspan></text><text x="272.5" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#08285a"><tspan x="272.5" dy="0">ChatGPT</tspan></text><text x="272.5" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#526b8a"><tspan x="272.5" dy="0">intake en triage</tspan></text><line x1="358" y1="335" x2="374" y2="335" stroke="#1683e8" stroke-width="3"/><polygon points="374,335 364,329 364,341" fill="#1683e8"/><rect x="380" y="155" width="185" height="355" rx="18" fill="#eaf5ff" stroke="#1683e8" stroke-width="2"/><text x="472.5" y="215" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#1683e8"><tspan x="472.5" dy="0">⚙</tspan></text><text x="472.5" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#08285a"><tspan x="472.5" dy="0">Orchestrator</tspan></text><text x="472.5" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#526b8a"><tspan x="472.5" dy="0">deterministische</tspan><tspan x="472.5" dy="21">control plane</tspan></text><line x1="568" y1="335" x2="584" y2="335" stroke="#1683e8" stroke-width="3"/><polygon points="584,335 574,329 574,341" fill="#1683e8"/><rect x="590" y="155" width="185" height="355" rx="18" fill="#eaf5ff" stroke="#1683e8" stroke-width="2"/><text x="682.5" y="215" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#1683e8"><tspan x="682.5" dy="0">B</tspan></text><text x="682.5" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#08285a"><tspan x="682.5" dy="0">Brain</tspan></text><text x="682.5" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#526b8a"><tspan x="682.5" dy="0">kiest één begrensde</tspan><tspan x="682.5" dy="21">volgende batch</tspan></text><line x1="778" y1="335" x2="794" y2="335" stroke="#1683e8" stroke-width="3"/><polygon points="794,335 784,329 784,341" fill="#1683e8"/><rect x="800" y="155" width="185" height="355" rx="18" fill="#eaf5ff" stroke="#1683e8" stroke-width="2"/><text x="892.5" y="215" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#1683e8"><tspan x="892.5" dy="0">W</tspan></text><text x="892.5" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#08285a"><tspan x="892.5" dy="0">Worker</tspan></text><text x="892.5" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#526b8a"><tspan x="892.5" dy="0">voert één batch</tspan><tspan x="892.5" dy="21">uit binnen scope</tspan></text><line x1="988" y1="335" x2="1004" y2="335" stroke="#1683e8" stroke-width="3"/><polygon points="1004,335 994,329 994,341" fill="#1683e8"/><rect x="1010" y="155" width="185" height="355" rx="18" fill="#eaf5ff" stroke="#1683e8" stroke-width="2"/><text x="1102.5" y="215" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#1683e8"><tspan x="1102.5" dy="0">✓</tspan></text><text x="1102.5" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#08285a"><tspan x="1102.5" dy="0">Evidence / Tests</tspan></text><text x="1102.5" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#526b8a"><tspan x="1102.5" dy="0">diff · files · tests</tspan><tspan x="1102.5" dy="21">scope checks</tspan></text><line x1="1198" y1="335" x2="1214" y2="335" stroke="#1683e8" stroke-width="3"/><polygon points="1214,335 1204,329 1204,341" fill="#1683e8"/><rect x="1220" y="155" width="195" height="355" rx="18" fill="#eaf5ff" stroke="#1683e8" stroke-width="2"/><text x="1317.5" y="215" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#1683e8"><tspan x="1317.5" dy="0">R</tspan></text><text x="1317.5" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#08285a"><tspan x="1317.5" dy="0">Reviewer</tspan></text><text x="1317.5" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#526b8a"><tspan x="1317.5" dy="0">onafhankelijke</tspan><tspan x="1317.5" dy="21">inspectie</tspan></text><text x="472" y="360" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" fill="#526b8a"><tspan x="472" dy="0">state</tspan><tspan x="472" dy="20">phases</tspan><tspan x="472" dy="20">retries</tspan><tspan x="472" dy="20">locks</tspan><tspan x="472" dy="20">Git safety</tspan><tspan x="472" dy="20">tests</tspan><tspan x="472" dy="20">commits</tspan><tspan x="472" dy="20">escalatie</tspan></text><text x="682" y="405" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#526b8a"><tspan x="682" dy="0">Bepaalt één kleine stap</tspan><tspan x="682" dy="20">binnen de scope.</tspan></text><text x="892" y="405" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#526b8a"><tspan x="892" dy="0">Schrijft code, past</tspan><tspan x="892" dy="20">bestanden aan.</tspan></text><text x="1102" y="405" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#526b8a"><tspan x="1102" dy="0">Objectief bewijs:</tspan><tspan x="1102" dy="20">diff + tests + scope.</tspan></text><text x="1318" y="405" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="650" fill="#526b8a"><tspan x="1318" dy="0">PASS · FAIL</tspan><tspan x="1318" dy="22">NEEDS_HUMAN</tspan></text><path d="M 1318 510 L 1318 585 L 1125 585" fill="none" stroke="#159b5b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1220" y="568" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#159b5b"><tspan x="1220" dy="0">PASS</tspan></text><rect x="870" y="548" width="245" height="78" rx="14" fill="#eaf9f1" stroke="#159b5b" stroke-width="2"/><text x="992" y="580" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#08285a"><tspan x="992" dy="0">Commit</tspan></text><text x="992" y="607" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="450" fill="#526b8a"><tspan x="992" dy="0">alleen na PASS</tspan></text><path d="M 870 590 L 735 590 Q 680 590 680 530 L 680 510" fill="none" stroke="#159b5b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="770" y="575" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#159b5b"><tspan x="770" dy="0">volgende batch</tspan></text><path d="M 1305 510 L 1305 655 L 680 655 L 680 510" fill="none" stroke="#f57c16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="940" y="680" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#f57c16"><tspan x="940" dy="0">FAIL → repair via Brain</tspan></text><path d="M 1335 510 L 1335 730 L 1225 730" fill="none" stroke="#e44444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1040" y="695" width="180" height="72" rx="14" fill="#fff0f0" stroke="#e44444" stroke-width="2"/><text x="1130" y="724" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#e44444"><tspan x="1130" dy="0">NEEDS_HUMAN</tspan></text><text x="1130" y="750" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#526b8a"><tspan x="1130" dy="0">menselijke beslissing</tspan></text><path d="M 1355 510 L 1355 595" fill="none" stroke="#5f7087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><text x="1355" y="618" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#5f7087"><tspan x="1355" dy="0">DONE</tspan></text><rect x="40" y="815" width="1360" height="175" rx="20" fill="#eaf5ff" stroke="#1683e8" stroke-width="2" stroke-dasharray="8 7"/><text x="120" y="865" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800" fill="#1683e8"><tspan x="120" dy="0">▰</tspan></text><text x="160" y="855" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#08285a"><tspan x="160" dy="0">Desktop Commander</tspan></text><text x="160" y="884" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="450" fill="#526b8a"><tspan x="160" dy="0">optionele VM tool bridge</tspan></text><circle cx="165" cy="918" r="5" fill="#1683e8"/><text x="182" y="924" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="450" fill="#526b8a"><tspan x="182" dy="0">voor beheer en diagnose</tspan></text><circle cx="165" cy="943" r="5" fill="#1683e8"/><text x="182" y="949" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="450" fill="#526b8a"><tspan x="182" dy="0">bestanden, processen, logs, terminal</tspan></text><circle cx="165" cy="968" r="5" fill="#1683e8"/><text x="182" y="974" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="450" fill="#526b8a"><tspan x="182" dy="0">geen onderdeel van de state machine</tspan></text><text x="1130" y="905" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" fill="#526b8a"><tspan x="1130" dy="0">Maakt gecontroleerde toegang tot de VM mogelijk voor beheer en diagnose.</tspan></text><text x="720" y="1040" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" fill="#526b8a"><tspan x="720" dy="0">De orchestrator blijft authoritative. Modellen zijn verwisselbare uitvoerders.</tspan></text></svg>