<rect width="100%" height="100%" rx="28" fill="url(#bg)"/><text x="48" y="64" text-anchor="start" class="h" font-size="48"><tspan x="48" dy="0">De autonome ontwikkelloop</tspan></text><text x="48" y="106" text-anchor="start" class="m" font-size="22"><tspan x="48" dy="0">Eén globale opdracht. Urenlang gecontroleerde softwareontwikkeling.</tspan></text><g filter="url(#shadow)"><rect x="28" y="160" width="180" height="285" rx="24" fill="white"/><rect x="28" y="160" width="180" height="86" rx="24" fill="url(#blue)"/><rect x="28" y="222" width="180" height="24" fill="url(#blue)"/>
<text x="62" y="215" text-anchor="middle" class="w" font-size="34"><tspan x="62" dy="0">●</tspan></text><text x="118.0" y="215" text-anchor="middle" class="w" font-size="21"><tspan x="118.0" dy="0">Opdracht</tspan><tspan x="118.0" dy="24.779999999999998">in ChatGPT</tspan></text><text x="118.0" y="286" text-anchor="middle" class="m" font-size="16"><tspan x="118.0" dy="0">In gewone taal</tspan></text></g><path d="M 208 300 H 216" stroke="#1683e8" stroke-width="5" fill="none"/><path d="M 210 292 l14 8 -14 8" fill="#1683e8"/><g filter="url(#shadow)"><rect x="228" y="160" width="180" height="285" rx="24" fill="white"/><rect x="228" y="160" width="180" height="86" rx="24" fill="url(#blue)"/><rect x="228" y="222" width="180" height="24" fill="url(#blue)"/>
<text x="262" y="215" text-anchor="middle" class="w" font-size="34"><tspan x="262" dy="0">⚙</tspan></text><text x="318.0" y="215" text-anchor="middle" class="w" font-size="21"><tspan x="318.0" dy="0">Orchestrator</tspan></text><text x="318.0" y="286" text-anchor="middle" class="m" font-size="16"><tspan x="318.0" dy="0">State · fases ·</tspan><tspan x="318.0" dy="18.88">Git · tests · commits</tspan></text></g><path d="M 408 300 H 416" stroke="#1683e8" stroke-width="5" fill="none"/><path d="M 410 292 l14 8 -14 8" fill="#1683e8"/><g filter="url(#shadow)"><rect x="428" y="160" width="180" height="285" rx="24" fill="white"/><rect x="428" y="160" width="180" height="86" rx="24" fill="url(#purple)"/><rect x="428" y="222" width="180" height="24" fill="url(#purple)"/>
<text x="462" y="215" text-anchor="middle" class="w" font-size="34"><tspan x="462" dy="0">B</tspan></text><text x="518.0" y="215" text-anchor="middle" class="w" font-size="21"><tspan x="518.0" dy="0">Brain</tspan></text><text x="518.0" y="286" text-anchor="middle" class="m" font-size="16"><tspan x="518.0" dy="0">Bepaalt één</tspan><tspan x="518.0" dy="18.88">begrensde batch</tspan></text></g><path d="M 608 300 H 616" stroke="#1683e8" stroke-width="5" fill="none"/><path d="M 610 292 l14 8 -14 8" fill="#1683e8"/><g filter="url(#shadow)"><rect x="628" y="160" width="180" height="285" rx="24" fill="white"/><rect x="628" y="160" width="180" height="86" rx="24" fill="url(#green)"/><rect x="628" y="222" width="180" height="24" fill="url(#green)"/>
<text x="662" y="215" text-anchor="middle" class="w" font-size="34"><tspan x="662" dy="0"></></tspan></text><text x="718.0" y="215" text-anchor="middle" class="w" font-size="21"><tspan x="718.0" dy="0">Worker</tspan></text><text x="718.0" y="286" text-anchor="middle" class="m" font-size="16"><tspan x="718.0" dy="0">Voert batch uit</tspan><tspan x="718.0" dy="18.88">binnen scope</tspan></text></g><path d="M 808 300 H 816" stroke="#1683e8" stroke-width="5" fill="none"/><path d="M 810 292 l14 8 -14 8" fill="#1683e8"/><g filter="url(#shadow)"><rect x="828" y="160" width="180" height="285" rx="24" fill="white"/><rect x="828" y="160" width="180" height="86" rx="24" fill="url(#orange)"/><rect x="828" y="222" width="180" height="24" fill="url(#orange)"/>
<text x="862" y="215" text-anchor="middle" class="w" font-size="34"><tspan x="862" dy="0">≣</tspan></text><text x="918.0" y="215" text-anchor="middle" class="w" font-size="21"><tspan x="918.0" dy="0">Evidence</tspan><tspan x="918.0" dy="24.779999999999998">& Tests</tspan></text><text x="918.0" y="286" text-anchor="middle" class="m" font-size="16"><tspan x="918.0" dy="0">Diff · bestanden ·</tspan><tspan x="918.0" dy="18.88">tests · scope</tspan></text></g><path d="M 1008 300 H 1016" stroke="#1683e8" stroke-width="5" fill="none"/><path d="M 1010 292 l14 8 -14 8" fill="#1683e8"/><g filter="url(#shadow)"><rect x="1028" y="160" width="180" height="285" rx="24" fill="white"/><rect x="1028" y="160" width="180" height="86" rx="24" fill="url(#red)"/><rect x="1028" y="222" width="180" height="24" fill="url(#red)"/>
<text x="1062" y="215" text-anchor="middle" class="w" font-size="34"><tspan x="1062" dy="0">✓</tspan></text><text x="1118.0" y="215" text-anchor="middle" class="w" font-size="21"><tspan x="1118.0" dy="0">Reviewer</tspan></text><text x="1118.0" y="286" text-anchor="middle" class="m" font-size="16"><tspan x="1118.0" dy="0">PASS / FAIL /</tspan><tspan x="1118.0" dy="18.88">NEEDS_HUMAN</tspan></text></g><path d="M 1208 300 H 1216" stroke="#1683e8" stroke-width="5" fill="none"/><path d="M 1210 292 l14 8 -14 8" fill="#1683e8"/><g filter="url(#shadow)"><rect x="1228" y="160" width="180" height="285" rx="24" fill="white"/><rect x="1228" y="160" width="180" height="86" rx="24" fill="url(#blue)"/><rect x="1228" y="222" width="180" height="24" fill="url(#blue)"/>
<text x="1262" y="215" text-anchor="middle" class="w" font-size="34"><tspan x="1262" dy="0">⑂</tspan></text><text x="1318.0" y="215" text-anchor="middle" class="w" font-size="21"><tspan x="1318.0" dy="0">Commit</tspan></text><text x="1318.0" y="286" text-anchor="middle" class="m" font-size="16"><tspan x="1318.0" dy="0">Alleen na PASS</tspan><tspan x="1318.0" dy="18.88">dan terug naar Brain</tspan></text></g><rect x="55" y="510" width="285" height="105" rx="22" fill="#eaf9f1" stroke="#159b5b" stroke-width="2"/><text x="83" y="550" text-anchor="start" class="h" font-size="22"><tspan x="83" dy="0">PASS</tspan></text><text x="83" y="585" text-anchor="start" class="m" font-size="16"><tspan x="83" dy="0">→ commit en volgende stap</tspan></text><rect x="370" y="510" width="285" height="105" rx="22" fill="#fff0f0" stroke="#df404c" stroke-width="2"/><text x="398" y="550" text-anchor="start" class="h" font-size="22"><tspan x="398" dy="0">FAIL</tspan></text><text x="398" y="585" text-anchor="start" class="m" font-size="16"><tspan x="398" dy="0">→ repair via Brain</tspan></text><rect x="685" y="510" width="285" height="105" rx="22" fill="#fff5e9" stroke="#f07800" stroke-width="2"/><text x="713" y="550" text-anchor="start" class="h" font-size="22"><tspan x="713" dy="0">NEEDS_HUMAN</tspan></text><text x="713" y="585" text-anchor="start" class="m" font-size="16"><tspan x="713" dy="0">→ pauze, menselijke beslissing</tspan></text><rect x="1010" y="510" width="370" height="105" rx="22" fill="#eef6ff" stroke="#a9d8ff" stroke-width="2"/><text x="1038" y="548" text-anchor="start" class="h" font-size="21"><tspan x="1038" dy="0">Andere toestanden</tspan></text><text x="1038" y="580" text-anchor="start" class="m" font-size="18"><tspan x="1038" dy="0">WAITING · DONE · ERROR</tspan></text><rect x="55" y="675" width="400" height="210" rx="24" fill="#fff5e9" stroke="#ffc27b" stroke-width="2"/><text x="85" y="720" text-anchor="start" class="h" font-size="22"><tspan x="85" dy="0">⚙  Wat is deterministisch?</tspan></text><text x="85" y="765" text-anchor="start" class="m" font-size="17"><tspan x="85" dy="0">workflow en fases</tspan><tspan x="85" dy="20.06">locks en Git-gates</tspan><tspan x="85" dy="20.06">tests en evidence</tspan><tspan x="85" dy="20.06">retries, caps en commits</tspan></text><rect x="520" y="675" width="400" height="210" rx="24" fill="#eef7ff" stroke="#9fd2ff" stroke-width="2"/><text x="550" y="720" text-anchor="start" class="h" font-size="25"><tspan x="550" dy="0">AI</tspan></text><text x="550" y="765" text-anchor="start" class="m" font-size="17"><tspan x="550" dy="0">planning</tspan><tspan x="550" dy="20.06">code schrijven</tspan><tspan x="550" dy="20.06">reviewen</tspan><tspan x="550" dy="20.06">redeneren over fouten</tspan></text><rect x="985" y="675" width="395" height="210" rx="24" fill="#f4f7fb" stroke="#c9d4df" stroke-width="2"/><text x="1015" y="720" text-anchor="start" class="h" font-size="22"><tspan x="1015" dy="0">Huidige implementatie</tspan></text><text x="1015" y="765" text-anchor="start" class="m" font-size="17"><tspan x="1015" dy="0">Brain + Reviewer: Claude</tspan><tspan x="1015" dy="20.06">Worker: auto / Claude /</tspan><tspan x="1015" dy="20.06">Gemini / Codex</tspan></text><text x="720" y="942" text-anchor="middle" class="m" font-size="19"><tspan x="720" dy="0">De orchestrator blijft de baas. De kracht zit in de gecontroleerde, herhaalbare loop.</tspan></text></svg>