<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#061c35"/><stop offset="1" stop-color="#073050"/></linearGradient><style>.t{font-family:Arial,sans-serif;fill:#f7fbff}.m{font-family:Arial,sans-serif;fill:#c5d9eb}.h{font-weight:700}.s{font-size:17px}</style></defs><rect width="1600" height="820" rx="28" fill="url(#b)" stroke="#1676ad"/><text x="55" y="70" class="t h" font-size="44">The decision and recovery cycle</text><text x="55" y="108" class="m" font-size="21">What the orchestrator does after review, failure, or waiting.</text><rect x="590" y="150" width="420" height="115" rx="22" fill="#171d55" stroke="#a87cff" stroke-width="3"/><text x="800" y="198" text-anchor="middle" class="t h" font-size="26">Reviewer</text><text x="800" y="232" text-anchor="middle" class="m" font-size="18">checks result · diff · tests · criteria</text><path d="M800 265v55M205 320h1190M205 320v40M600 320v40M1000 320v40M1395 320v40" fill="none" stroke="#55bfff" stroke-width="5"/><rect x="70" y="360" width="280" height="285" rx="22" fill="#0b3153" stroke="#24d5a8" stroke-width="3"/><text x="210" y="415" text-anchor="middle" class="t h" font-size="25">PASS</text><text x="210" y="448" text-anchor="middle" fill="#24d5a8" font-family="Arial" font-weight="700" font-size="18">Approve and continue</text><text x="98" y="510" class="m s">• Commit result</text><text x="98" y="546" class="m s">• Update state</text><text x="98" y="582" class="m s">• Next batch</text><rect x="465" y="360" width="280" height="285" rx="22" fill="#0b3153" stroke="#ff5f72" stroke-width="3"/><text x="605" y="415" text-anchor="middle" class="t h" font-size="25">FAIL</text><text x="605" y="448" text-anchor="middle" fill="#ff5f72" font-family="Arial" font-weight="700" font-size="18">Repair via Brain</text><text x="493" y="510" class="m s">• Analyse failure</text><text x="493" y="546" class="m s">• Brain defines fix</text><text x="493" y="582" class="m s">• Retry</text><rect x="860" y="360" width="280" height="285" rx="22" fill="#0b3153" stroke="#ffad32" stroke-width="3"/><text x="1000" y="415" text-anchor="middle" class="t h" font-size="25">NEEDS_HUMAN</text><text x="1000" y="448" text-anchor="middle" fill="#ffad32" font-family="Arial" font-weight="700" font-size="18">Pause for human</text><text x="888" y="510" class="m s">• Show context</text><text x="888" y="546" class="m s">• Wait for decision</text><text x="888" y="582" class="m s">• Resume afterwards</text><rect x="1255" y="360" width="280" height="285" rx="22" fill="#0b3153" stroke="#35aaff" stroke-width="3"/><text x="1395" y="415" text-anchor="middle" class="t h" font-size="25">WAITING</text><text x="1395" y="448" text-anchor="middle" fill="#35aaff" font-family="Arial" font-weight="700" font-size="18">Wait and resume</text><text x="1283" y="510" class="m s">• Temporary pause</text><text x="1283" y="546" class="m s">• Schedule or trigger</text><text x="1283" y="582" class="m s">• Resume automatically</text><path d="M210 645v55h455M605 645v55h60M1000 645v55h-65M1395 645v55H935" fill="none" stroke="#64bfff" stroke-width="4"/><rect x="665" y="670" width="270" height="70" rx="18" fill="#20175d" stroke="#a87cff" stroke-width="3"/><text x="800" y="703" text-anchor="middle" class="t h" font-size="25">DONE</text><text x="800" y="728" text-anchor="middle" class="m s">Job completed successfully</text><rect x="55" y="765" width="1490" height="35" rx="13" fill="#0b3559"/><text x="800" y="789" text-anchor="middle" class="m" font-size="16">Deterministic control · transparent progress · safe recovery · autonomous continuation</text></svg>