<svg xmlns="http://www.w3.org/2000/svg" width="740" height="1354" viewBox="0 0 740 1354" role="img" aria-label="De autonome ontwikkelloop">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#edf6ff"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3fa7ff"/><stop offset="1" stop-color="#1269d3"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b7dff"/><stop offset="1" stop-color="#6548d8"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42d7a2"/><stop offset="1" stop-color="#11945f"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbe45"/><stop offset="1" stop-color="#f07800"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7b85"/><stop offset="1" stop-color="#de3d49"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0e3d72" flood-opacity=".16"/></filter>
 <style>text{font-family:Inter,Arial,sans-serif} .h{font-weight:800;fill:#08285a} .m{fill:#496685} .w{fill:white;font-weight:800} .s{font-size:18px}</style>
</defs>
<rect width="100%" height="100%" rx="28" fill="url(#bg)"/><text x="55" y="72" text-anchor="start" class="h" font-size="42"><tspan x="55" dy="0">De autonome</tspan><tspan x="55" dy="49.559999999999995">ontwikkelloop</tspan></text><text x="55" y="154" text-anchor="start" class="m" font-size="20"><tspan x="55" dy="0">Eén opdracht. Urenlang resultaat.</tspan></text><g filter="url(#shadow)"><rect x="46" y="205" width="648" height="105" rx="20" fill="white"/><rect x="46" y="205" width="92" height="105" rx="20" fill="url(#blue)"/><text x="92" y="269" text-anchor="middle" class="w" font-size="28"><tspan x="92" dy="0">●</tspan></text><text x="165" y="247" text-anchor="start" class="h" font-size="20"><tspan x="165" dy="0">1. Opdracht in ChatGPT</tspan></text><text x="165" y="281" text-anchor="start" class="m" font-size="16"><tspan x="165" dy="0">In gewone taal</tspan></text></g><g filter="url(#shadow)"><rect x="46" y="327" width="648" height="105" rx="20" fill="white"/><rect x="46" y="327" width="92" height="105" rx="20" fill="url(#blue)"/><text x="92" y="391" text-anchor="middle" class="w" font-size="28"><tspan x="92" dy="0">⚙</tspan></text><text x="165" y="369" text-anchor="start" class="h" font-size="20"><tspan x="165" dy="0">2. Orchestrator</tspan></text><text x="165" y="403" text-anchor="start" class="m" font-size="16"><tspan x="165" dy="0">State, planning, tests, commits</tspan></text></g><g filter="url(#shadow)"><rect x="46" y="449" width="648" height="105" rx="20" fill="white"/><rect x="46" y="449" width="92" height="105" rx="20" fill="url(#purple)"/><text x="92" y="513" text-anchor="middle" class="w" font-size="28"><tspan x="92" dy="0">B</tspan></text><text x="165" y="491" text-anchor="start" class="h" font-size="20"><tspan x="165" dy="0">3. Brain</tspan></text><text x="165" y="525" text-anchor="start" class="m" font-size="16"><tspan x="165" dy="0">Bepaalt volgende batch</tspan></text></g><g filter="url(#shadow)"><rect x="46" y="571" width="648" height="105" rx="20" fill="white"/><rect x="46" y="571" width="92" height="105" rx="20" fill="url(#green)"/><text x="92" y="635" text-anchor="middle" class="w" font-size="28"><tspan x="92" dy="0"></></tspan></text><text x="165" y="613" text-anchor="start" class="h" font-size="20"><tspan x="165" dy="0">4. Worker</tspan></text><text x="165" y="647" text-anchor="start" class="m" font-size="16"><tspan x="165" dy="0">Voert code uit</tspan></text></g><g filter="url(#shadow)"><rect x="46" y="693" width="648" height="105" rx="20" fill="white"/><rect x="46" y="693" width="92" height="105" rx="20" fill="url(#orange)"/><text x="92" y="757" text-anchor="middle" class="w" font-size="28"><tspan x="92" dy="0">≣</tspan></text><text x="165" y="735" text-anchor="start" class="h" font-size="20"><tspan x="165" dy="0">5. Evidence & Tests</tspan></text><text x="165" y="769" text-anchor="start" class="m" font-size="16"><tspan x="165" dy="0">Objectief bewijs</tspan></text></g><g filter="url(#shadow)"><rect x="46" y="815" width="648" height="105" rx="20" fill="white"/><rect x="46" y="815" width="92" height="105" rx="20" fill="url(#red)"/><text x="92" y="879" text-anchor="middle" class="w" font-size="28"><tspan x="92" dy="0">✓</tspan></text><text x="165" y="857" text-anchor="start" class="h" font-size="20"><tspan x="165" dy="0">6. Reviewer</tspan></text><text x="165" y="891" text-anchor="start" class="m" font-size="16"><tspan x="165" dy="0">PASS / FAIL / NEEDS_HUMAN</tspan></text></g><g filter="url(#shadow)"><rect x="46" y="937" width="648" height="105" rx="20" fill="white"/><rect x="46" y="937" width="92" height="105" rx="20" fill="url(#blue)"/><text x="92" y="1001" text-anchor="middle" class="w" font-size="28"><tspan x="92" dy="0">⑂</tspan></text><text x="165" y="979" text-anchor="start" class="h" font-size="20"><tspan x="165" dy="0">7. Commit</tspan></text><text x="165" y="1013" text-anchor="start" class="m" font-size="16"><tspan x="165" dy="0">Bij PASS, dan verder</tspan></text></g><path d="M 640 1041 V 1094 H 100 V 994" stroke="#1683e8" stroke-width="5" fill="none"/><text x="370" y="1084" text-anchor="middle" class="h" font-size="18"><tspan x="370" dy="0">Herhaal tot klaar</tspan></text><rect x="48" y="1139" width="180" height="105" rx="20" fill="#eaf9f1" stroke="#159b5b" stroke-width="2"/><text x="138" y="1179" text-anchor="middle" class="h" font-size="18"><tspan x="138" dy="0">PASS</tspan></text><text x="138" y="1215" text-anchor="middle" class="m" font-size="15"><tspan x="138" dy="0">→ verder</tspan></text><rect x="258" y="1139" width="180" height="105" rx="20" fill="#fff0f0" stroke="#df404c" stroke-width="2"/><text x="348" y="1179" text-anchor="middle" class="h" font-size="18"><tspan x="348" dy="0">FAIL</tspan></text><text x="348" y="1215" text-anchor="middle" class="m" font-size="15"><tspan x="348" dy="0">→ repair</tspan></text><rect x="468" y="1139" width="180" height="105" rx="20" fill="#fff5e9" stroke="#f07800" stroke-width="2"/><text x="558" y="1179" text-anchor="middle" class="h" font-size="18"><tspan x="558" dy="0">NEEDS_HUMAN</tspan></text><text x="558" y="1215" text-anchor="middle" class="m" font-size="15"><tspan x="558" dy="0">→ mens</tspan></text><text x="370" y="1304" text-anchor="middle" class="m" font-size="18"><tspan x="370" dy="0">De orchestrator blijft leidend.</tspan></text></svg>