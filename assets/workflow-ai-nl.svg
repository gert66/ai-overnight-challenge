<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061c35"/><stop offset="1" stop-color="#073050"/></linearGradient><style>.t{font-family:Arial,sans-serif;fill:#f6fbff}.m{font-family:Arial,sans-serif;fill:#c5d9eb}.h{font-weight:700}.s{font-size:17px}</style></defs><rect width="1600" height="720" rx="28" fill="url(#bg)" stroke="#1676ad" stroke-width="2"/><text x="55" y="70" class="t h" font-size="42">De workflow: plan, bouw, test, review, repareer, leg vast</text><text x="55" y="108" class="m" font-size="21">Elke fase heeft een duidelijke rol en levert concrete output op.</text><g transform="translate(35 155)"><rect x="0" width="225" height="365" rx="20" fill="#0b3153" stroke="#4aa8ff" stroke-width="2"/><circle cx="35" cy="38" r="22" fill="#4aa8ff"/><text x="35" y="45" text-anchor="middle" class="t h" font-size="20">1</text><text x="112" y="105" text-anchor="middle" class="t h" font-size="25">Planning</text><text x="112" y="140" text-anchor="middle" fill="#4aa8ff" font-family="Arial" font-size="19">Brain</text><text x="28" y="245" class="m s">• Kies één begrensde batch</text><text x="28" y="276" class="m s">• Bepaal scope</text><text x="28" y="307" class="m s">• Definieer taken</text><path d="M225 182h30" stroke="#6bd3ff" stroke-width="4"/><path d="M247 174l12 8-12 8" fill="#6bd3ff"/><rect x="255" width="225" height="365" rx="20" fill="#0b3153" stroke="#34dfd2" stroke-width="2"/><circle cx="290" cy="38" r="22" fill="#34dfd2"/><text x="290" y="45" text-anchor="middle" class="t h" font-size="20">2</text><text x="367" y="105" text-anchor="middle" class="t h" font-size="25">Bouw</text><text x="367" y="140" text-anchor="middle" fill="#34dfd2" font-family="Arial" font-size="19">Worker</text><text x="283" y="245" class="m s">• Schrijft code</text><text x="283" y="276" class="m s">• Voert taken uit</text><text x="283" y="307" class="m s">• Maakt tests</text><path d="M480 182h30" stroke="#6bd3ff" stroke-width="4"/><path d="M502 174l12 8-12 8" fill="#6bd3ff"/><rect x="510" width="225" height="365" rx="20" fill="#0b3153" stroke="#ffc44d" stroke-width="2"/><circle cx="545" cy="38" r="22" fill="#ffc44d"/><text x="545" y="45" text-anchor="middle" class="t h" font-size="20">3</text><text x="622" y="105" text-anchor="middle" class="t h" font-size="25">Test &amp; Evidence</text><text x="622" y="140" text-anchor="middle" fill="#ffc44d" font-family="Arial" font-size="19">Orchestrator</text><text x="538" y="245" class="m s">• Draait tests</text><text x="538" y="276" class="m s">• Verzamelt resultaten</text><text x="538" y="307" class="m s">• Scope checks</text><text x="538" y="338" class="m s">• Objectief bewijs</text><path d="M735 182h30" stroke="#6bd3ff" stroke-width="4"/><path d="M757 174l12 8-12 8" fill="#6bd3ff"/><rect x="765" width="225" height="365" rx="20" fill="#0b3153" stroke="#aa83ff" stroke-width="2"/><circle cx="800" cy="38" r="22" fill="#aa83ff"/><text x="800" y="45" text-anchor="middle" class="t h" font-size="20">4</text><text x="877" y="105" text-anchor="middle" class="t h" font-size="25">Review</text><text x="877" y="140" text-anchor="middle" fill="#aa83ff" font-family="Arial" font-size="19">Reviewer</text><text x="793" y="245" class="m s">• Controleert resultaat</text><text x="793" y="276" class="m s">• Diff + tests + criteria</text><text x="793" y="307" class="m s">• PASS of verder</text><path d="M990 182h30" stroke="#6bd3ff" stroke-width="4"/><path d="M1012 174l12 8-12 8" fill="#6bd3ff"/><rect x="1020" width="225" height="365" rx="20" fill="#0b3153" stroke="#ff6476" stroke-width="2"/><circle cx="1055" cy="38" r="22" fill="#ff6476"/><text x="1055" y="45" text-anchor="middle" class="t h" font-size="20">5</text><text x="1132" y="105" text-anchor="middle" class="t h" font-size="25">Repareer</text><text x="1132" y="140" text-anchor="middle" fill="#ff6476" font-family="Arial" font-size="19">Worker via Brain</text><text x="1048" y="245" class="m s">• Alleen bij FAIL</text><text x="1048" y="276" class="m s">• Analyseert fout</text><text x="1048" y="307" class="m s">• Gerichte fix</text><text x="1048" y="338" class="m s">• Nieuwe tests</text><path d="M1245 182h30" stroke="#6bd3ff" stroke-width="4"/><path d="M1267 174l12 8-12 8" fill="#6bd3ff"/><rect x="1275" width="225" height="365" rx="20" fill="#0b3153" stroke="#43e0b1" stroke-width="2"/><circle cx="1310" cy="38" r="22" fill="#43e0b1"/><text x="1310" y="45" text-anchor="middle" class="t h" font-size="20">6</text><text x="1387" y="105" text-anchor="middle" class="t h" font-size="25">Leg vast</text><text x="1387" y="140" text-anchor="middle" fill="#43e0b1" font-family="Arial" font-size="19">Orchestrator</text><text x="1303" y="245" class="m s">• Alleen na PASS</text><text x="1303" y="276" class="m s">• Commit</text><text x="1303" y="307" class="m s">• Update state</text><text x="1303" y="338" class="m s">• Volgende batch</text></g><path d="M1430 520v70H160v-70" fill="none" stroke="#64bfff" stroke-width="5"/><rect x="620" y="558" width="360" height="58" rx="18" fill="#0b3b66" stroke="#64bfff" stroke-width="2"/><text x="800" y="595" text-anchor="middle" class="t h" font-size="22">Automatisch verder tot het klaar is</text><g transform="translate(50 650)"><text x="0" class="t h" font-size="19">⚙ Deterministische sturing</text><text x="390" class="t h" font-size="19">▥ Meetbare voortgang</text><text x="760" class="t h" font-size="19">↻ Automatisch herstel</text><text x="1120" class="t h" font-size="19">⚡ Robuust en autonoom</text></g></svg>