<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#edf6ff"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42d7a2"/><stop offset="1" stop-color="#11945f"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7b85"/><stop offset="1" stop-color="#de3d49"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbe45"/><stop offset="1" stop-color="#f07800"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3fa7ff"/><stop offset="1" stop-color="#1269d3"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b7dff"/><stop offset="1" stop-color="#6548d8"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0e3d72" flood-opacity=".15"/></filter>
</defs><rect width="1440" height="900" rx="28" fill="url(#bg)"/>
<text x="55" y="66" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="850" fill="#08285a"><tspan x="55" dy="0">The decision and recovery cycle</tspan></text><text x="55" y="108" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#496685"><tspan x="55" dy="0">What the orchestrator does after review, failure, or waiting.</tspan></text>
<rect x="470" y="165" width="500" height="105" rx="28" fill="white" stroke="#a9d8ff" stroke-width="2" filter="url(#shadow)"/>
<text x="720" y="205" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="850" fill="#08285a"><tspan x="720" dy="0">Reviewer</tspan></text><text x="720" y="240" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#496685"><tspan x="720" dy="0">checks real diff · tests · criteria</tspan></text>
<rect x="70" y="345" width="260" height="150" rx="24" fill="white" filter="url(#shadow)"/><rect x="70" y="345" width="260" height="62" rx="24" fill="url(#green)"/><rect x="70" y="385" width="260" height="22" fill="url(#green)"/><text x="200" y="385" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="850" fill="white"><tspan x="200" dy="0">PASS</tspan></text><text x="200" y="447" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#496685"><tspan x="200" dy="0">Commit → next Brain batch</tspan></text><rect x="370" y="345" width="260" height="150" rx="24" fill="white" filter="url(#shadow)"/><rect x="370" y="345" width="260" height="62" rx="24" fill="url(#red)"/><rect x="370" y="385" width="260" height="22" fill="url(#red)"/><text x="500" y="385" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="850" fill="white"><tspan x="500" dy="0">FAIL</tspan></text><text x="500" y="447" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#496685"><tspan x="500" dy="0">Repair via Brain</tspan></text><rect x="670" y="345" width="260" height="150" rx="24" fill="white" filter="url(#shadow)"/><rect x="670" y="345" width="260" height="62" rx="24" fill="url(#orange)"/><rect x="670" y="385" width="260" height="22" fill="url(#orange)"/><text x="800" y="385" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="850" fill="white"><tspan x="800" dy="0">NEEDS_HUMAN</tspan></text><text x="800" y="447" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#496685"><tspan x="800" dy="0">Pause for human</tspan></text><rect x="970" y="345" width="260" height="150" rx="24" fill="white" filter="url(#shadow)"/><rect x="970" y="345" width="260" height="62" rx="24" fill="url(#blue)"/><rect x="970" y="385" width="260" height="22" fill="url(#blue)"/><text x="1100" y="385" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="850" fill="white"><tspan x="1100" dy="0">WAITING</tspan></text><text x="1100" y="447" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#496685"><tspan x="1100" dy="0">Wait and resume</tspan></text>
<rect x="250" y="575" width="390" height="125" rx="22" fill="#eef7ff" stroke="#9fd2ff" stroke-width="2"/>
<text x="445" y="615" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="850" fill="#6649d8"><tspan x="445" dy="0">DONE</tspan></text><text x="445" y="655" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#496685"><tspan x="445" dy="0">Job completed successfully</tspan></text>
<rect x="800" y="575" width="390" height="125" rx="22" fill="#f4f7fb" stroke="#c9d4df" stroke-width="2"/>
<text x="995" y="615" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="850" fill="#5f7087"><tspan x="995" dy="0">ERROR</tspan></text><text x="995" y="655" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#496685"><tspan x="995" dy="0">Terminal error state</tspan></text>
<path d="M 720 270 V 320" stroke="#1683e8" stroke-width="5"/><path d="M 720 320 H 200 V 345 M 720 320 H 500 V 345 M 720 320 H 800 V 345 M 720 320 H 1100 V 345" fill="none" stroke="#1683e8" stroke-width="4"/>
<text x="720" y="780" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#496685"><tspan x="720" dy="0">Deterministic: workflow · locks · Git · tests · retries · caps · commits</tspan></text>
<text x="720" y="820" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#496685"><tspan x="720" dy="0">AI: planning · writing code · reviewing · reasoning about errors</tspan></text>
</svg>