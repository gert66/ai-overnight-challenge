<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#061c35"/><stop offset="1" stop-color="#073050"/></linearGradient><style>.t{font-family:Arial,sans-serif;fill:#f7fbff}.m{font-family:Arial,sans-serif;fill:#c5d9eb}.h{font-weight:700}.s{font-size:16px}</style></defs><rect width="1600" height="650" rx="28" fill="url(#b)" stroke="#1676ad"/><text x="50" y="65" class="t h" font-size="40">Workflow: plan, build, test, review, repair, commit</text><text x="50" y="100" class="m" font-size="20">Each phase has a clear role and produces concrete output.</text><g transform="translate(35 145)"><rect x="0" width="225" height="340" rx="20" fill="#0b3153" stroke="#4aa8ff" stroke-width="2"/><circle cx="35" cy="38" r="21" fill="#4aa8ff"/><text x="35" y="45" text-anchor="middle" class="t h" font-size="19">1</text><text x="112" y="100" text-anchor="middle" class="t h" font-size="23">Planning</text><text x="112" y="132" text-anchor="middle" fill="#4aa8ff" font-family="Arial" font-size="17">Brain</text><text x="25" y="215" class="m s">• Choose bounded batch</text><text x="25" y="244" class="m s">• Set scope</text><text x="25" y="273" class="m s">• Define tasks</text><path d="M225 170h30" stroke="#6bd3ff" stroke-width="4"/><path d="M247 162l12 8-12 8" fill="#6bd3ff"/><rect x="255" width="225" height="340" rx="20" fill="#0b3153" stroke="#34dfd2" stroke-width="2"/><circle cx="290" cy="38" r="21" fill="#34dfd2"/><text x="290" y="45" text-anchor="middle" class="t h" font-size="19">2</text><text x="367" y="100" text-anchor="middle" class="t h" font-size="23">Build</text><text x="367" y="132" text-anchor="middle" fill="#34dfd2" font-family="Arial" font-size="17">Worker</text><text x="280" y="215" class="m s">• Write code</text><text x="280" y="244" class="m s">• Run tasks</text><text x="280" y="273" class="m s">• Create tests</text><path d="M480 170h30" stroke="#6bd3ff" stroke-width="4"/><path d="M502 162l12 8-12 8" fill="#6bd3ff"/><rect x="510" width="225" height="340" rx="20" fill="#0b3153" stroke="#ffc44d" stroke-width="2"/><circle cx="545" cy="38" r="21" fill="#ffc44d"/><text x="545" y="45" text-anchor="middle" class="t h" font-size="19">3</text><text x="622" y="100" text-anchor="middle" class="t h" font-size="23">Test &amp; Evidence</text><text x="622" y="132" text-anchor="middle" fill="#ffc44d" font-family="Arial" font-size="17">Orchestrator</text><text x="535" y="215" class="m s">• Run tests</text><text x="535" y="244" class="m s">• Collect results</text><text x="535" y="273" class="m s">• Scope checks</text><text x="535" y="302" class="m s">• Objective evidence</text><path d="M735 170h30" stroke="#6bd3ff" stroke-width="4"/><path d="M757 162l12 8-12 8" fill="#6bd3ff"/><rect x="765" width="225" height="340" rx="20" fill="#0b3153" stroke="#aa83ff" stroke-width="2"/><circle cx="800" cy="38" r="21" fill="#aa83ff"/><text x="800" y="45" text-anchor="middle" class="t h" font-size="19">4</text><text x="877" y="100" text-anchor="middle" class="t h" font-size="23">Review</text><text x="877" y="132" text-anchor="middle" fill="#aa83ff" font-family="Arial" font-size="17">Reviewer</text><text x="790" y="215" class="m s">• Check result</text><text x="790" y="244" class="m s">• Diff + tests + criteria</text><text x="790" y="273" class="m s">• PASS or continue</text><path d="M990 170h30" stroke="#6bd3ff" stroke-width="4"/><path d="M1012 162l12 8-12 8" fill="#6bd3ff"/><rect x="1020" width="225" height="340" rx="20" fill="#0b3153" stroke="#ff6476" stroke-width="2"/><circle cx="1055" cy="38" r="21" fill="#ff6476"/><text x="1055" y="45" text-anchor="middle" class="t h" font-size="19">5</text><text x="1132" y="100" text-anchor="middle" class="t h" font-size="23">Repair</text><text x="1132" y="132" text-anchor="middle" fill="#ff6476" font-family="Arial" font-size="17">Worker via Brain</text><text x="1045" y="215" class="m s">• Only on FAIL</text><text x="1045" y="244" class="m s">• Analyse error</text><text x="1045" y="273" class="m s">• Targeted fix</text><text x="1045" y="302" class="m s">• New tests</text><path d="M1245 170h30" stroke="#6bd3ff" stroke-width="4"/><path d="M1267 162l12 8-12 8" fill="#6bd3ff"/><rect x="1275" width="225" height="340" rx="20" fill="#0b3153" stroke="#43e0b1" stroke-width="2"/><circle cx="1310" cy="38" r="21" fill="#43e0b1"/><text x="1310" y="45" text-anchor="middle" class="t h" font-size="19">6</text><text x="1387" y="100" text-anchor="middle" class="t h" font-size="23">Commit</text><text x="1387" y="132" text-anchor="middle" fill="#43e0b1" font-family="Arial" font-size="17">Orchestrator</text><text x="1300" y="215" class="m s">• Only after PASS</text><text x="1300" y="244" class="m s">• Commit</text><text x="1300" y="273" class="m s">• Update state</text><text x="1300" y="302" class="m s">• Next batch</text></g><path d="M1430 485v65H160v-65" fill="none" stroke="#64bfff" stroke-width="5"/><rect x="630" y="520" width="340" height="55" rx="17" fill="#0b3b66" stroke="#64bfff" stroke-width="2"/><text x="800" y="555" text-anchor="middle" class="t h" font-size="21">Continue automatically until done</text><text x="80" y="615" class="t h" font-size="17">Deterministic control</text><text x="470" y="615" class="t h" font-size="17">Measurable progress</text><text x="850" y="615" class="t h" font-size="17">Automatic recovery</text><text x="1230" y="615" class="t h" font-size="17">Robust and autonomous</text></svg>